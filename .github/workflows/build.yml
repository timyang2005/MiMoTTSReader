name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MiMoTTSReader.apk || true
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/MiMoTTSReader.apk || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MiMoTTSReader
        path: app/build/outputs/apk/release/MiMoTTSReader.apk

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: false
        files: app/build/outputs/apk/release/MiMoTTSReader.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
